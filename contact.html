            </button>
            
            <!--Navbar links-->
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                
                <!-- Search Bar -->
                <form class="d-flex search-form my-3 my-lg-0" role="search">
                    <input class="form-control search-input" type="search" placeholder="Search" aria-label="Search"/>
                    <button class="btn search-btn" type="submit">Search</button>
                </form>
                
                <ul class="navbar-nav mb-2 mb-lg-0 align-items-lg-center gap-lg-3">

                    <li class="nav-item">
                        <a class="nav-link" href="archive.html">ARCHIVE</a>

                    <li class="nav-item">

    <form id="contactForm" class="contact-form">
        <div class="form-row">
            <label for="name">Name:</label>
            <input type="text" id="name" required>
        </div>

        <div class="form-row">
            <label for="email">E-mail</label>
            <input type="email" id="email" required>
        </div>

        <div class="form-row">
            <label for="movieTitle">Movie Title:</label>
            <input type="text" id="movieTitle" required>
        </div>

        <div class="form-row">
            <label for="comments">Additional Comments:</label>
            <input type="text" id="comments">
        </div>

        <button type="submit" class="contact-submit">Submit</button>
    </form>
    <!-- Footer -->
    <footer class="footer-section">
        <div class="container-fluid px-5">
            <div class="row gy-4 align-items-end">
                
                <!--Left Side-->
                <div class="col-lg-8">
                    <h3 class="footer-logo">ArcHive</h3>
                    
                    <p class="footer-tagline">
                        Discover, Track & Explore films.
                    </p>
                    
                    <h5 class="footer-heading">Quick Links</h5>

                    </div>
                    
                    <p class="copyright">
                        © 2026 ArcHive. All rights reserved.
                    </p>
                    
                </div>
            </div>

<script src="assets/scripts/bootstrap.bundle.min.js"></script>
<script>
    document.getElementById("contactForm").addEventListener("submit", function(event)  {
        event.preventDefault();

        const name = document.getElementById("name").value;
        const email = document.getElementById("email").value;
        const movieTitle = document.getElementById("movieTitle").value;
        const comments = document.getElementById("comments").value;

        const subject = "Movie Suggestion for ArcHive";
        const body =
        "Name: " + name + "%0D%0A" +
        "Email: " + email + "%0D%0A" +
        "Movie Title: " + movieTitle + "%0D%0A" +
        "Additional Comments: " + comments;

        window.location.href = "mailto:tanaya.galea.g53878@mcast.edu.mt?subject=" + subject + "&body=" + body;
    });
</script>
</body>
